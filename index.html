<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recursive Factorial Simulator AI 1</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f3f4f6;
        margin: 0;
        padding: 40px 20px;
    }

    .container {
        max-width: 800px;
        margin: auto;
    }

    h1 {
        text-align: center;
        margin-bottom: 5px;
    }

    .subtitle {
        text-align: center;
        color: #666;
        margin-bottom: 25px;
    }

    .box {
        background: white;
        padding: 25px;
        border-radius: 10px;
        margin-bottom: 20px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
    }

    input {
        padding: 10px;
        width: 180px;
        font-size: 16px;
    }

    button {
        padding: 10px 16px;
        margin-left: 5px;
        border: none;
        border-radius: 5px;
        background: #333;
        color: white;
        cursor: pointer;
    }

    button:hover {
        background: #555;
    }

    .result {
        margin-top: 20px;
        padding: 15px;
        background: #f0f0f0;
        border-radius: 6px;
    }

    .process {
        line-height: 1.8;
        font-family: monospace;
    }

    .error {
        color: #b00020;
    }

    .log {
        margin: 5px 0;
    }
</style>
</head>

<body>
<div class="container">

    <h1>Recursive Factorial Simulator AI 1</h1>
    <div class="subtitle">Recursion — Factorial</div>

    <div class="box">
        <label>Masukkan angka</label>
        <input type="number" id="angka" min="0" max="20" placeholder="Contoh: 5">
        <button onclick="hitung()">Calculate</button>
        <button onclick="resetSimulasi()">Reset</button>

        <div id="hasil" class="result">
            Belum ada perhitungan.
        </div>
    </div>

    <div class="box">
        <h3>Proses Rekursif</h3>
        <div id="proses" class="process">-</div>
    </div>

    <div class="box">
        <h3>Activity Log</h3>
        <div id="log">Belum ada aktivitas.</div>
    </div>

</div>

<script>
function factorial(n, proses) {
    proses.push("Factorial(" + n + ")");

    if (n <= 1) {
        proses.push("Base case: n = " + n + " → return 1");
        return 1;
    }

    return n * factorial(n - 1, proses);
}

function hitung() {
    var input = document.getElementById("angka");
    var hasil = document.getElementById("hasil");
    var prosesDiv = document.getElementById("proses");
    var logDiv = document.getElementById("log");

    var n = parseInt(input.value);

    if (isNaN(n) || n < 0 || n > 20) {
        hasil.innerHTML = '<span class="error">Masukkan angka 0 sampai 20.</span>';
        return;
    }

    var proses = [];
    var hasilAkhir = factorial(n, proses);

    var bentuk = "";
    if (n === 0) {
        bentuk = "0! = 1";
    } else {
        for (var i = n; i >= 1; i--) {
            bentuk += i;
            if (i > 1) {
                bentuk += " × ";
            }
        }
        bentuk += " = " + hasilAkhir;
    }

    hasil.innerHTML = "<b>Hasil:</b> " + bentuk;

    var teksProses = "";
    for (var j = 0; j < proses.length; j++) {
        teksProses += proses[j];
        if (j < proses.length - 1) {
            teksProses += "<br>↓<br>";
        }
    }

    prosesDiv.innerHTML = teksProses;

    logDiv.innerHTML =
        '<div class="log">1. Calculate(' + n + ') → berhasil.</div>' +
        '<div class="log">2. Factorial(' + n + ') → hasil = ' + hasilAkhir + '.</div>';
}

function resetSimulasi() {
    document.getElementById("angka").value = "";
    document.getElementById("hasil").innerHTML = "Belum ada perhitungan.";
    document.getElementById("proses").innerHTML = "-";
    document.getElementById("log").innerHTML = "Belum ada aktivitas.";
}
</script>

</body>
</html>
